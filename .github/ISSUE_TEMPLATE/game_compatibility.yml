name: Game compatibility report
description: Tell us whether the overlay works in a specific game
labels: [compatibility]
body:
  - type: input
    id: game
    attributes:
      label: Game
    validations:
      required: true
  - type: dropdown
    id: works
    attributes:
      label: Does the overlay show up?
      options: ["Yes, everything works", "Yes, but some values are empty", "No"]
    validations:
      required: true
  - type: input
    id: anticheat
    attributes:
      label: Anti-cheat / launch options (if known)
      placeholder: e.g. VAC, EAC, -allow_third_party_software
  - type: textarea
    id: notes
    attributes:
      label: Notes
